services:
  - type: web
    name: herdix-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      # ─── Base de datos ──────────────────────────────────────────────────
      # Debes crearla tú en Neon (ver README) y pegar aquí la connection
      # string "pooled" que te da Neon. Márcala como "sync: false" en el
      # panel de Render si prefieres pegarla manualmente en vez de por Blueprint.
      - key: DATABASE_URL
        sync: false

      # ─── Seguridad JWT ──────────────────────────────────────────────────
      # Genera un valor real con: openssl rand -hex 32
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"

      # ─── IA (Groq) ──────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: AGENTE_MODEL
        value: openai/gpt-oss-120b

      # ─── Correo (Brevo) ─────────────────────────────────────────────────
      # Registro abierto con verificación de email y recuperación de contraseña.
      # Se usa la API HTTP de Brevo porque Render (plan gratuito) bloquea SMTP.
      - key: BREVO_API_KEY
        sync: false
      # Remitente verificado en Brevo (Senders & IP → Senders)
      - key: EMAIL_REMITENTE
        sync: false
      - key: EMAIL_REMITENTE_NOMBRE
        value: Herdix
      # URL pública del frontend, para los enlaces de los correos
      # Ejemplo: https://herdix.vercel.app
      - key: FRONTEND_URL
        sync: false

      # ─── CORS ───────────────────────────────────────────────────────────
      # Dominio(s) del frontend en Vercel, separados por comas si hay varios.
      # Ejemplo: https://herdix.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # ─── Entorno ────────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production
